name: 分享资源
description: 向客韵资源库投稿音乐、乐谱、影像、文献或素材
title: "[资源] "
labels: [resource-pending]
body:
  - type: dropdown
    id: category
    attributes:
      label: 资源分类
      options: [音乐, 乐谱, 影像, 文献, 素材]
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: 作者或来源
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 资源链接
      description: 填写公开可访问的 HTTPS 链接
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 资源介绍
    validations:
      required: true
  - type: dropdown
    id: license
    attributes:
      label: 使用许可
      options: [仅供学习欣赏，其他使用请联系作者, CC BY 4.0, CC BY-NC 4.0, CC0]
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: 权利确认
      options:
        - label: 我有权分享该资源，并确认链接可公开访问。
          required: true
