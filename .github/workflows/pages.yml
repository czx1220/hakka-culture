name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export approved resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/export-resources.mjs
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html style.css app.js resources.js composer.js config.js _site/
          cp -R assets _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
